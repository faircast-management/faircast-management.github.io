<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Faircast Management</title>
  <meta name="description" content="Contact Faircast Management.">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <!-- No tracking, no cookies, no third-party scripts. form-action must match the form service host below. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'none'; style-src 'self'; img-src 'self' data:; form-action https://api.web3forms.com; base-uri 'none'; frame-ancestors 'none'">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <a class="skip" href="#contact">Skip to contact form</a>

  <header class="site-header">
    <div class="wrap">
      <span class="wordmark">Faircast <span class="wordmark-light">Management</span></span>
    </div>
  </header>

  <main id="main" class="wrap">
    <section class="intro" aria-labelledby="page-title">
      <h1 id="page-title">Contact us</h1>
      <p class="lede">We'd love to hear from you.</p>
    </section>

    <section class="card" aria-labelledby="form-title">
      <h2 id="form-title" class="visually-hidden">Send a message</h2>

      <!--
        ======================== FORM_ENDPOINT CONFIG ========================
        Service: Web3Forms (https://web3forms.com) — endpoint URL is fixed.
        THE ONLY THING TO SWAP: replace 0d836c1a-54ff-420c-89a4-3b8c2e4a99d0 below with the access
        key Web3Forms emails to the company inbox.
        If you change services, change the action URL here AND the host in the
        Content-Security-Policy "form-action" in <head>.
        =====================================================================
      -->
      <form id="contact" class="contact-form" action="https://api.web3forms.com/submit" method="POST" accept-charset="UTF-8">
        <input type="hidden" name="access_key" value="0d836c1a-54ff-420c-89a4-3b8c2e4a99d0">
        <input type="hidden" name="subject" value="New message from faircastmanagement.com">
        <input type="hidden" name="from_name" value="Faircast Management website">
        <!-- Web3Forms requires an absolute URL on the same domain for free plans -->
        <input type="hidden" name="redirect" value="https://faircastmanagement.com/thanks.html">
        <!-- Honeypot: humans never see this; Web3Forms drops submissions where it is checked -->
        <input type="checkbox" name="botcheck" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">

        <div class="field">
          <label for="name">Name</label>
          <input id="name" name="name" type="text" autocomplete="name" required maxlength="120">
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="email" required maxlength="254">
        </div>

        <div class="field">
          <label for="message">Message</label>
          <textarea id="message" name="message" rows="6" required maxlength="5000"></textarea>
        </div>

        <button type="submit" class="btn">Send message</button>
        <p class="fineprint">All fields are required. We only use your details to reply to you.</p>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <p>&copy; 2026 Faircast Management</p>
    </div>
  </footer>
</body>
</html>
